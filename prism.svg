<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2a2a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff2a2a" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a7fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2a7fff" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2aff2a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2aff2a" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- CUBE 1 — back-left, red channel -->
  <g transform="translate(150 180)">
    <polygon points="0,60 80,0 160,60 80,120" fill="url(#red)" opacity="0.85"/>
    <polygon points="0,60 0,200 80,260 80,120" fill="url(#red)" opacity="0.5" filter="url(#blur)"/>
    <polygon points="80,120 80,260 160,200 160,60" fill="#000" opacity="0.85"/>
    <polygon points="0,60 80,0 160,60 80,120" fill="none" stroke="#ff2a2a" stroke-width="1.2" opacity="0.9"/>
  </g>

  <!-- CUBE 2 — back-right, cyan channel -->
  <g transform="translate(360 140)">
    <polygon points="0,60 80,0 160,60 80,120" fill="url(#cyan)" opacity="0.85"/>
    <polygon points="0,60 0,200 80,260 80,120" fill="url(#cyan)" opacity="0.5" filter="url(#blur)"/>
    <polygon points="80,120 80,260 160,200 160,60" fill="#000" opacity="0.85"/>
    <polygon points="0,60 80,0 160,60 80,120" fill="none" stroke="#2a7fff" stroke-width="1.2" opacity="0.9"/>
  </g>

  <!-- CUBE 3 — front-center, lime channel, biggest -->
  <g transform="translate(220 300)">
    <polygon points="0,80 100,0 200,80 100,160" fill="url(#lime)" opacity="0.9"/>
    <polygon points="0,80 0,260 100,340 100,160" fill="url(#lime)" opacity="0.5" filter="url(#blur)"/>
    <polygon points="100,160 100,340 200,260 200,80" fill="#000" opacity="0.9"/>
    <polygon points="0,80 100,0 200,80 100,160" fill="none" stroke="#2aff2a" stroke-width="1.4" opacity="0.95"/>
    <!-- specular highlight -->
    <polygon points="20,72 60,46 70,52 30,80" fill="#fffdf9" opacity="0.6"/>
  </g>

  <!-- CUBE 4 — small accent, top -->
  <g transform="translate(80 80)">
    <polygon points="0,40 50,0 100,40 50,80" fill="url(#cyan)" opacity="0.7"/>
    <polygon points="0,40 0,140 50,180 50,80" fill="url(#red)" opacity="0.4" filter="url(#blur)"/>
    <polygon points="50,80 50,180 100,140 100,40" fill="#000" opacity="0.8"/>
    <polygon points="0,40 50,0 100,40 50,80" fill="none" stroke="#2a7fff" stroke-width="1" opacity="0.8"/>
  </g>

  <!-- CUBE 5 — small accent, right -->
  <g transform="translate(480 360)">
    <polygon points="0,40 50,0 100,40 50,80" fill="url(#red)" opacity="0.7"/>
    <polygon points="0,40 0,140 50,180 50,80" fill="url(#lime)" opacity="0.4" filter="url(#blur)"/>
    <polygon points="50,80 50,180 100,140 100,40" fill="#000" opacity="0.8"/>
    <polygon points="0,40 50,0 100,40 50,80" fill="none" stroke="#ff2a2a" stroke-width="1" opacity="0.8"/>
  </g>

  <!-- RGB-split chromatic ghosts on the front cube -->
  <g transform="translate(220 300)" opacity="0.55">
    <polygon points="0,80 100,0 200,80 100,160" fill="none" stroke="#ff2a2a" stroke-width="1" transform="translate(-6 -4)"/>
    <polygon points="0,80 100,0 200,80 100,160" fill="none" stroke="#2a7fff" stroke-width="1" transform="translate(6 4)"/>
  </g>
</svg>
